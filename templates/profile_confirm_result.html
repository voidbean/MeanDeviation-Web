<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人画像已更新 · 8848</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .main-container { margin-top: 30px; margin-bottom: 40px; }
    </style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3">
    <a class="navbar-brand fw-bold" href="/">8848</a>
    <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">分析</a>
        <a class="nav-link active fw-semibold" href="/review">交易复盘</a>
        <a class="nav-link" href="/sector">板块轮动</a>
    </div>
</nav>

<div class="container main-container" style="max-width: 600px;">
    {% if success %}
    <div class="card shadow-sm border-success text-center py-5">
        <div class="card-body">
            <div style="font-size: 3rem;">✅</div>
            <h5 class="mt-3 fw-bold text-success">个人画像已更新</h5>
            <p class="text-muted mt-2">
                <code>skills/personal/trading_profile.md</code> 已成功写入。<br>
                下次 AI 分析时将自动加载新的个人画像。
            </p>
            <div class="d-flex gap-3 justify-content-center mt-4">
                <a href="/review" class="btn btn-primary">返回复盘页</a>
                <a href="/" class="btn btn-outline-secondary">去分析页</a>
            </div>
        </div>
    </div>
    {% else %}
    <div class="card shadow-sm border-danger text-center py-5">
        <div class="card-body">
            <div style="font-size: 3rem;">❌</div>
            <h5 class="mt-3 fw-bold text-danger">写入失败</h5>
            <p class="text-muted mt-2">
                文件写入时发生错误，个人画像未更新。
            </p>
            {% if error_msg %}
            <div class="alert alert-danger text-start mt-3 small">
                <strong>错误详情：</strong><br>{{ error_msg }}
            </div>
            {% endif %}
            <div class="mt-4">
                <a href="/review" class="btn btn-outline-secondary">返回复盘页</a>
            </div>
        </div>
    </div>
    {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
