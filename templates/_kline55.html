{% if result and result.status == 'success' %}
<div class="card shadow-sm mt-3" id="kline55-panel" data-code="{{ result.code }}">
    <div class="card-header bg-white d-flex flex-wrap gap-2 justify-content-between align-items-center">
        <h6 class="mb-0">多周期55线 <span class="badge bg-secondary">研究预览</span></h6>
        <div class="d-flex gap-2">
            <select id="kline55-period" class="form-select form-select-sm" aria-label="55线周期">
                <option value="D">日线</option><option value="60min">60分钟</option><option value="15min">15分钟</option>
            </select>
            <button id="kline55-refresh" class="btn btn-sm btn-outline-primary text-nowrap" type="button">获取 / 更新</button>
        </div>
    </div>
    <div class="card-body">
        <p class="small text-muted mb-2">仅历史数据，最晚截至昨日；MA由Tushare SDK计算。暂不用于实时买卖通知。首次使用请按周期获取，连续请求至少间隔90秒。</p>
        <div id="kline55-status" class="small mb-2" role="status" aria-live="polite">正在读取本地缓存…</div>
        <div id="kline55-summary" class="small mb-2"></div>
        <section id="kline55-analysis" class="border rounded p-3 mb-2" style="display:none" aria-label="55线历史信号分析">
            <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                <span class="badge bg-warning text-dark border border-warning" title="规则来源，不代表已验证胜率">规则来源：55线</span>
                <strong>历史形态</strong><span id="kline55-state" class="badge bg-secondary"></span>
            </div>
            <div id="kline55-reason" class="small mb-2"></div>
            <div id="kline55-evidence" class="small text-muted mb-2"></div>
            <div id="kline55-levels" class="small mb-2"></div>
            <details class="small"><summary>规则参数与数据限制（非胜率）</summary><div id="kline55-rules" class="mt-2"></div><ul id="kline55-warnings" class="mt-2 mb-0"></ul></details>
            <div class="small fw-semibold mt-2">最近历史事件（不等于当前信号）</div>
            <ul id="kline55-events" class="small mb-0 mt-1"></ul>
        </section>
        <div id="kline55-chart" style="width:100%;height:340px;display:none" aria-label="历史K线与MA55及MA233"></div>
        <div id="kline55-note" class="small text-muted mt-2"></div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const panel = document.getElementById('kline55-panel');
    if (!panel) return;
    const select = document.getElementById('kline55-period');
    const button = document.getElementById('kline55-refresh');
    const status = document.getElementById('kline55-status');
    const summary = document.getElementById('kline55-summary');
    const note = document.getElementById('kline55-note');
    const chartDom = document.getElementById('kline55-chart');
    const analysisDom = document.getElementById('kline55-analysis');
    let chart = null, requestId = 0, refreshing = false;
    const value = v => v == null ? '数据不足' : Number(v).toFixed(2);
    const dateLabel = v => String(v).replace(/^(\d{4})(\d{2})(\d{2})$/, '$1-$2-$3');
    function renderAnalysis(a) {
        analysisDom.style.display = a ? 'block' : 'none';
        if (!a) return;
        const state = document.getElementById('kline55-state');
        state.textContent = a.label + (a.signal ? ' · 本根历史K线触发' : '');
        state.className = 'badge ' + (a.signal ? 'bg-primary' : 'bg-secondary');
        document.getElementById('kline55-reason').textContent = (a.as_of ? '复核截至 ' + dateLabel(a.as_of) + '：' : '') + a.reason;
        const e = a.evidence || {}, parts = [];
        if (e.daily_time) parts.push('日线背景截至 ' + dateLabel(e.daily_time));
        if (e.checks) {
            const labels = {bullish_order: '多头排列', rising: '斜率向上', above_ma20: '收盘高于MA20', above_ma55: '收盘高于MA55'};
            parts.push(Object.entries(e.checks).map(([key,pass]) => (labels[key] || key) + '：' + (pass ? '满足' : '未满足')).join(' / '));
        }
        if (e.slope_pct) parts.push('近3根日线斜率：' + Object.entries(e.slope_pct).map(([key,v]) => key.toUpperCase() + ' ' + value(v) + '%').join(' / '));
        if (e.breakout_time) parts.push('60分钟突破 ' + dateLabel(e.breakout_time));
        if (e.touch_time) parts.push('首次回踩 ' + dateLabel(e.touch_time));
        if (Object.prototype.hasOwnProperty.call(e, 'volume_ratio')) parts.push('回踩量比 ' + value(e.volume_ratio));
        document.getElementById('kline55-evidence').textContent = parts.join('；');
        const levels = a.levels || {};
        document.getElementById('kline55-levels').textContent =
            (levels.ma55 != null ? '历史MA55 ' + value(levels.ma55) + '。' : '') +
            (levels.pullback_low != null ? ' 回踩低点 ' + value(levels.pullback_low) + '。' : '') +
            (levels.reference_pressure != null ? ' 上方参考 ' + value(levels.reference_pressure) + '（' + levels.pressure_source + '）。' : '') +
            (levels.invalidation ? ' 失效条件：' + levels.invalidation : '');
        const r = a.rules;
        document.getElementById('kline55-rules').textContent = r ?
            a.version + '：日线MA5>MA10>MA20，近' + r.slope_bars + '根斜率均>0；日线突破有效期' + r.daily_breakout_bars +
            '根。60分钟突破后离线≥' + (r.departure*100) + '%，回踩上沿容忍' + (r.touch_above*100) +
            '%，最大刺穿' + (r.max_pierce*100) + '%；首次回踩量比≤' + r.contraction +
            '，回踩当根或之后' + r.reclaim_bars + '根内收回MA55上方' + (r.reclaim_buffer*100) +
            '%并收阳、高于前收。整轮最多' + r.setup_bars + '根。' : '';
        const warnings = document.getElementById('kline55-warnings'); warnings.replaceChildren();
        for (const text of a.warnings || []) { const li = document.createElement('li'); li.textContent = text; warnings.appendChild(li); }
        const events = document.getElementById('kline55-events'); events.replaceChildren();
        for (const event of (a.events || []).slice(-5).reverse()) {
            const li = document.createElement('li');
            li.className = 'mb-1';
            const source = document.createElement('span');
            source.className = 'badge bg-warning text-dark me-1';
            source.textContent = '55线';
            source.title = '触发规则来源：55线；' + (event.rule_version || a.version);
            li.append(source, document.createTextNode(dateLabel(event.time) + ' · ' + event.label + ' · 收盘 ' + value(event.close) +
                ' · ' + event.type + (event.evidence.daily_time ? ' · 日线依据 ' + dateLabel(event.evidence.daily_time) : '')));
            events.appendChild(li);
        }
        if (!events.childElementCount) { const li = document.createElement('li'); li.textContent = '当前历史窗口内无已确认事件，或数据条件不足。'; events.appendChild(li); }
    }
    function render(data) {
        const snapshot = data.snapshot;
        renderAnalysis(data.analysis);
        if (!snapshot) {
            chartDom.style.display = 'none'; summary.textContent = ''; note.textContent = '';
            status.textContent = data.message || '暂无本地缓存。点击“获取 / 更新”读取此周期历史数据。';
            return;
        }
        status.textContent = (data.message ? data.message + ' 当前展示旧缓存。' : '历史缓存已就绪。') +
            ' 数据截至 ' + dateLabel(snapshot.as_of) + '；获取时间 ' + snapshot.fetched_at.slice(0, 19).replace('T', ' ') + '（北京时间）。不是当前实时价格。';
        const last = snapshot.bars[snapshot.bars.length - 1];
        summary.textContent = snapshot.label + ' · ' + snapshot.samples + '根 · 前复权基准 ' + dateLabel(snapshot.adjustment_anchor) +
            ' · MA55 ' + value(last.ma55) + ' · MA233 ' + value(last.ma233);
        note.textContent = '前复权至所示基准日，保留官方分钟开盘记录，均线沿用SDK精度。历史形态由独立规则复核，不参与实时通知或交易执行。';
        if (typeof echarts === 'undefined') { note.textContent += ' 图表组件未加载，均线数值仍可查看。'; return; }
        chartDom.style.display = 'block';
        chart = chart || echarts.init(chartDom, null, {renderer: 'svg'});
        const bars = snapshot.bars.slice(-300);
        chart.setOption({
            animation: false,
            legend: {data: ['K线', 'MA55', 'MA233'], top: 0},
            tooltip: {trigger: 'axis'},
            grid: {left: 55, right: 15, top: 35, bottom: 65},
            xAxis: {type: 'category', data: bars.map(b => dateLabel(b.time)), boundaryGap: true},
            yAxis: {scale: true, type: 'value'},
            dataZoom: [{type: 'inside', start: 65, end: 100}, {type: 'slider', bottom: 5, start: 65, end: 100}],
            series: [
                {name: 'K线', type: 'candlestick', data: bars.map(b => [b.open, b.close, b.low, b.high]),
                 markPoint: {symbol: 'pin', symbolSize: 48, label: {fontSize: 9}, data: ((data.analysis || {}).events || [])
                    .filter(e => bars.some(b => b.time === e.time)).map(e => ({name: e.title || ('【55线】' + e.label), value: e.type === 'NEW_TREND' ? '55\n趋势' : '55\n转强', coord: [dateLabel(e.time), e.close]}))},
                 itemStyle: {color: '#dc3545', color0: '#198754', borderColor: '#dc3545', borderColor0: '#198754'}},
                {name: 'MA55', type: 'line', showSymbol: false, connectNulls: false, data: bars.map(b => b.ma55), itemStyle: {color: '#df9700'}, lineStyle: {color: '#df9700'}},
                {name: 'MA233', type: 'line', showSymbol: false, connectNulls: false, data: bars.map(b => b.ma233), itemStyle: {color: '#7652b4'}, lineStyle: {color: '#7652b4'}}
            ]
        }, true);
        chart.resize();
    }
    async function load(refresh) {
        if (refreshing) return;
        const id = ++requestId;
        if (refresh) { refreshing = true; button.disabled = true; select.disabled = true; }
        else { chartDom.style.display = 'none'; analysisDom.style.display = 'none'; summary.textContent = ''; note.textContent = ''; }
        status.textContent = refresh ? '正在获取官方K线与复权因子，请稍候…' : '正在读取本地缓存…';
        try {
            const params = new URLSearchParams({code: panel.dataset.code, period: select.value});
            const response = await fetch('/api/kline55' + (refresh ? '/refresh' : '') + '?' + params,
                {method: refresh ? 'POST' : 'GET'});
            const data = await response.json();
            if (id !== requestId) return;
            render(data);
        } catch (_) {
            if (id === requestId) status.textContent = '读取失败，已显示的图表可能是旧数据，请稍后重试。';
        } finally {
            if (refresh) { refreshing = false; button.disabled = false; select.disabled = false; }
        }
    }
    select.addEventListener('change', () => load(false));
    button.addEventListener('click', () => load(true));
    window.addEventListener('resize', () => { if (chart) chart.resize(); });
    load(false);
});
</script>
{% endif %}
