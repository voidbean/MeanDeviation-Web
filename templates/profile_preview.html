<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人画像更新预览 · 8848</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .main-container { margin-top: 30px; margin-bottom: 40px; }

        /* Markdown 渲染样式 */
        .profile-md { font-size: 0.875rem; line-height: 1.8; }
        .profile-md h1, .profile-md h2, .profile-md h3 {
            font-size: 1rem; font-weight: 700; margin-top: 0.8rem; margin-bottom: 0.3rem;
        }
        .profile-md h4, .profile-md h5 {
            font-size: 0.9rem; font-weight: 600; margin-top: 0.6rem; margin-bottom: 0.2rem;
        }
        .profile-md p { margin-bottom: 0.5rem; }
        .profile-md ul, .profile-md ol { padding-left: 1.4rem; margin-bottom: 0.5rem; }
        .profile-md li { margin-bottom: 0.2rem; }
        .profile-md strong { color: #333; }
        .profile-md hr { margin: 0.6rem 0; border-color: #dee2e6; }
        .profile-md code { background: #f0f0f0; padding: 0.1em 0.3em; border-radius: 3px; font-size: 0.82rem; }
        .profile-md blockquote { border-left: 3px solid #5b4fcf; padding-left: 0.8rem; color: #555; margin: 0.5rem 0; }

        /* 对比区域 */
        .diff-panel { background: #fff; border: 1px solid #dee2e6; border-radius: 6px; padding: 1rem; height: 100%; }
        .diff-panel-old { border-left: 4px solid #adb5bd; }
        .diff-panel-new { border-left: 4px solid #0d6efd; }
    </style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3">
    <a class="navbar-brand fw-bold" href="/">8848</a>
    <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">分析</a>
        <a class="nav-link active fw-semibold" href="/review">交易复盘</a>
        <a class="nav-link" href="/sector">板块轮动</a>
    </div>
</nav>

<div class="container main-container">

    <!-- 页头 -->
    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/review" class="btn btn-outline-secondary btn-sm">← 返回复盘</a>
        <h5 class="mb-0 fw-bold">个人画像更新预览</h5>
    </div>

    <!-- 变更说明卡片 -->
    <div class="card shadow-sm mb-4 border-primary">
        <div class="card-header bg-primary bg-opacity-10 fw-bold">
            🤖 AI 建议的变更说明
        </div>
        <div class="card-body">
            <div id="change-summary-content" class="profile-md"></div>
        </div>
    </div>

    <!-- 对比区域 -->
    <div class="row g-3 mb-4">
        <!-- 旧版 -->
        <div class="col-md-6">
            <div class="diff-panel diff-panel-old">
                <div class="fw-semibold text-muted mb-2 small">📄 当前版本</div>
                <div id="current-profile-content" class="profile-md"></div>
            </div>
        </div>
        <!-- 新版 -->
        <div class="col-md-6">
            <div class="diff-panel diff-panel-new">
                <div class="fw-semibold text-primary mb-2 small">✨ AI 建议新版本</div>
                <div id="new-profile-content" class="profile-md"></div>
            </div>
        </div>
    </div>

    <!-- 确认操作区 -->
    <div class="card shadow-sm border-warning">
        <div class="card-body">
            <p class="mb-3 text-muted small">
                确认后，上方"AI 建议新版本"的内容将写入
                <code>skills/personal/trading_profile.md</code>，覆盖当前版本。
                此操作不可撤销，请仔细核对后再确认。
            </p>
            <div class="d-flex gap-3">
                <!-- 确认写入 -->
                <form method="post" action="/review/confirm_profile" id="confirm-form">
                    <input type="hidden" name="new_profile" id="confirm-new-profile-input">
                    <button type="button" class="btn btn-primary"
                            onclick="submitConfirm()">
                        ✅ 确认写入个人画像
                    </button>
                </form>
                <!-- 放弃 -->
                <a href="/review" class="btn btn-outline-secondary">放弃，不做修改</a>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    marked.setOptions({ breaks: true });

    var currentProfile = {{ current_profile | tojson }};
    var newProfile     = {{ new_profile | tojson }};
    var changeSummary  = {{ change_summary | tojson }};

    document.getElementById('current-profile-content').innerHTML = marked.parse(currentProfile);
    document.getElementById('new-profile-content').innerHTML     = marked.parse(newProfile);
    document.getElementById('change-summary-content').innerHTML  = marked.parse(changeSummary);

    function submitConfirm() {
        document.getElementById('confirm-new-profile-input').value = newProfile;
        var btn = document.querySelector('#confirm-form button');
        btn.disabled = true;
        btn.textContent = '写入中…';
        document.getElementById('confirm-form').submit();
    }
</script>
</body>
</html>
